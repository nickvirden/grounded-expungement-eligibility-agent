# Workflow actions are pinned to commit SHAs, so a moved or compromised tag
# cannot change what a job runs. Dependabot proposes the pin updates as
# reviewed PRs; one grouped PR a week keeps the CI cost of them to a single run.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'

  # The release job's lockfile (.github/release) is updated the same way. The
  # conventionalcommits preset stays below its next major, which needs a newer
  # conventional-changelog-writer than the one semantic-release bundles.
  - package-ecosystem: npm
    directory: /.github/release
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      release-tooling:
        patterns:
          - '*'
    ignore:
      - dependency-name: conventional-changelog-conventionalcommits
        update-types:
          - version-update:semver-major
