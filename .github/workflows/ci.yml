name: CI

# release.yml gates what ships to production after a merge. This workflow
# runs on every PR and reports pass/fail, but until branch protection or a
# ruleset requires it as a status check, a red run here does not itself
# block merging — that's a separate GitHub repo setting, not something a
# workflow file can enforce on its own.
#
# The web and api gates run independently since they're separate toolchains;
# e2e needs both, since Playwright's webServer config boots the real FastAPI
# + the production Next.js build directly (not Docker).
on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No `version:` input here — pnpm/action-setup errors if both this and
      # package.json's `packageManager` field specify a version.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Style conventions
        run: pnpm check:styles

      - name: Unit tests
        run: pnpm test

      # Next restores incremental compiler output from this folder. The exact
      # key misses on every source change, so the restore-key supplies the
      # previous run's cache. Each job has its own prefix so the two parallel
      # builds never race to save the same key.
      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-web-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'apps/web/public/**', 'apps/web/next.config.ts', 'apps/web/tsconfig.json', 'apps/web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-web-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm --filter web build

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No python-version input — this action version doesn't support it; uv
      # reads apps/api/.python-version itself and provisions that interpreter.
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --extra dev --locked

      - name: Lint (ruff)
        working-directory: apps/api
        run: uv run ruff check .

      - name: Typecheck (mypy --strict)
        working-directory: apps/api
        run: uv run mypy .

      - name: Unit tests
        working-directory: apps/api
        run: uv run pytest -q

  # SQLite and Postgres differ in real ways (case sensitivity, type
  # coercion, transaction/constraint semantics) that the sqlite-backed api
  # job above can't surface. This runs the same suite against the actual
  # database the Compose deploy uses, migrated with Alembic like a real
  # deploy would be -- not create_all, which only ever runs on SQLite.
  api-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # A second, throwaway instance for the tests that manage their own
      # schema (test_health_readiness drops and recreates every table) or
      # that need a real server for concurrency (test_replay_guard's
      # 32-thread claim race). Those tests default to this host and
      # credentials, so they run here instead of silently skipping; keeping
      # them off the migrated instance above stops them from wiping the
      # schema the rest of the suite depends on.
      postgres-isolated:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: readyztest
          POSTGRES_DB: readyztest
        ports:
          - 5557:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-test-password@localhost:5432/ci_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --extra dev --locked

      - name: Apply migrations
        working-directory: apps/api
        run: uv run alembic upgrade head

      # Proves the migration is genuinely reversible (not just that it
      # applies once) and that it matches app/models.py exactly -- a future
      # model change with no matching migration would otherwise pass this
      # job silently (create_all covers the gap on SQLite; only `alembic
      # check` would catch it on Postgres).
      - name: Verify migration reversibility and drift
        working-directory: apps/api
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

      # -rs lists every skip with its reason, so a Postgres-dependent test
      # that quietly stops running shows up in the log.
      - name: Unit tests
        working-directory: apps/api
        run: uv run pytest -q -rs

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No `version:` input here — pnpm/action-setup errors if both this and
      # package.json's `packageManager` field specify a version.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # No python-version input — this action version doesn't support it; uv
      # reads apps/api/.python-version itself and provisions that interpreter.
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        working-directory: apps/api
        run: uv sync --locked

      # Next restores incremental compiler output from this folder. The exact
      # key misses on every source change, so the restore-key supplies the
      # previous run's cache. Each job has its own prefix so the two parallel
      # builds never race to save the same key.
      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'apps/web/public/**', 'apps/web/next.config.ts', 'apps/web/tsconfig.json', 'apps/web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-

      # The suite serves the build that ships, so the browser enforces the
      # production CSP (nonce-only styles, no unsafe-eval).
      - name: Build web (production)
        run: pnpm --filter web build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Playwright's own guidance is to install fresh rather than cache the
      # browser binaries: the download is fast enough that a cache restore
      # doesn't reliably beat it, and a stale cached binary silently drifts
      # from the @playwright/test version pinned in package.json.
      - name: Install Playwright browsers
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts's webServer block boots FastAPI (uv run, port
      # 8001, ephemeral test SQLite DB, LLM_PROVIDER=testmodel) and Next.js
      # (standalone build, port 3000, pointed at the test API) itself — no
      # Docker Compose involved here.
      - name: E2E tests
        run: pnpm e2e
        env:
          E2E_WEB_MODE: production

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
