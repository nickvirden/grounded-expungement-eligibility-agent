name: Release

# Every push to main is a candidate release. semantic-release inspects the
# Conventional Commits since the last tag and decides whether a release is
# warranted at all — a chore/docs-only push correctly produces no release.
on:
  push:
    branches: [main]

# No cancel-in-progress: a release that's already publishing shouldn't be
# killed mid-flight by a second push landing right after it. Queuing (the
# default) serializes runs instead.
concurrency:
  group: release-${{ github.workflow }}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # semantic-release pushes a chore(release) commit and tag straight to
      # main. With main protected by a branch ruleset, the default
      # GITHUB_TOKEN (github-actions[bot]) cannot bypass it, so releases run
      # as a GitHub App installation that the ruleset lists as a bypass actor.
      # The token is scoped to this repository only and expires after the job.
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # The checkout credential is what `git push` uses, so it must be the app
      # token too, not the default GITHUB_TOKEN.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # This job holds a token that can push to main, so the release tooling
      # is installed from a committed lockfile (.github/release) with exact
      # versions and integrity hashes, transitive dependencies included. A
      # newly published or compromised package version cannot reach it until a
      # reviewed Dependabot PR bumps the lockfile. The manifest lives outside
      # the root package.json and pnpm workspace so local installs don't carry
      # release tooling. Lifecycle scripts stay off: nothing here needs them.
      #
      # conventional-changelog-conventionalcommits stays on 8.x because
      # commit-analyzer/release-notes-generator resolve the preset package by
      # name at runtime (not as a declared dependency), and newer preset
      # majors require conventional-changelog-writer@9+ while the bundled
      # writer here is 8.x — a mismatch throws "Missing helper" mid-release.
      - name: Install release tooling
        run: npm ci --ignore-scripts --prefix .github/release

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ./.github/release/node_modules/.bin/semantic-release
