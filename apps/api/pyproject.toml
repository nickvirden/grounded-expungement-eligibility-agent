[project]
name = "grounded-expungement-eligibility-agent-api"
version = "1.0.0"
description = "ClearSlate Eligibility API - FastAPI + Pydantic AI"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pydantic-ai>=0.0.39",
    "structlog>=24.4.0",
    "slowapi>=0.1.9",
    "itsdangerous>=2.2.0",
    "httpx>=0.28.0",
    "ulid-py>=1.1.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T20", "ICN", "PIE", "PT", "RSE", "RET", "SIM", "TID", "TCH", "ARG", "PLC", "PLE", "PLW", "TRY", "FLY", "PERF", "RUF"]
ignore = ["S101", "TRY003", "RET504"]

# app/agents/providers.py's openai/anthropic/ollama construction passes
# api_key/base_url directly to model classes that reject them -- credentials
# must go through a Provider object instead. This is a live bug, reachable
# any time LLM_PROVIDER is set to one of those three (app/config.py's
# Settings rejects them at startup, but that's a separate safety net, not a
# fix to this file). Exempting lint/type checks here only defers fixing the
# construction itself; it does not make the bug safe. Remove this exemption
# as part of that fix.
[tool.ruff.lint.per-file-ignores]
"app/agents/providers.py" = ["PLC0415"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]

# See the ruff per-file-ignores comment above -- same known-broken
# construction, same "fix removes this exemption" expectation.
[[tool.mypy.overrides]]
module = "app.agents.providers"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
