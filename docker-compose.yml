services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - eligibility-agent
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      - NODE_ENV=production
      - API_URL=http://api:8000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 100
    mem_limit: 512m
    networks:
      - eligibility-agent
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=sqlite:///./data/eligibility.db
      - ALLOWED_ORIGINS=https://localhost
    env_file:
      - .env.example
    volumes:
      - api_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 100
    mem_limit: 512m
    networks:
      - eligibility-agent
    restart: unless-stopped

  # Optional: local LLM for offline demos
  ollama:
    image: ollama/ollama:latest
    profiles:
      - ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - eligibility-agent

networks:
  eligibility-agent:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  api_data:
  ollama_data:
