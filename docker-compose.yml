services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - eligibility-agent
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      - NODE_ENV=production
      # Server-side (Route Handlers / RSC) calls go directly to the api container.
      - INTERNAL_API_URL=http://api:8000
    healthcheck:
      # distroless has no shell/wget — use the bundled node binary directly.
      # Next.js standalone in this image binds to the container hostname, not 127.0.0.1.
      test: ["CMD", "/nodejs/bin/node", "-e", "const host=process.env.HOSTNAME||'localhost';require('http').get('http://'+host+':3000/', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Next.js (standalone) uses filesystem caching for prerender/ISR updates.
    # Keeping the container read-only breaks navigation and agent flows.
    read_only: false
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 100
    mem_limit: 512m
    networks:
      - eligibility-agent
    restart: unless-stopped

  api:
    build:
      # Monorepo root so the Dockerfile can reach packages/shared/ (decision trees).
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Schema is owned by Alembic: run `make migrate` before first boot and
      # after any change that adds a migration. The API never migrates itself.
      - DATABASE_URL=postgresql+psycopg://eligibility:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/eligibility
      - ALLOWED_ORIGINS=https://localhost
      # Tell the tree loader where the shared knowledge base was copied to.
      - STATE_TREES_DIR=/shared/state-trees
      - SERVICE_CATALOG_PATH=/shared/service-catalog.json
    # Load remaining vars (LLM_PROVIDER, CSRF_SECRET, SESSION_SECRET, etc.) from .env.
    env_file:
      - .env
    healthcheck:
      # /readyz, not /healthz: caddy's depends_on gates on this, and readyz
      # actually checks the DB schema is at the latest migration -- booting
      # against an unmigrated database (make up before make migrate) should
      # never look "healthy" to the rest of the stack.
      # python:3.13-slim has no curl/wget — use the stdlib urllib instead.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 100
    mem_limit: 512m
    networks:
      - eligibility-agent
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=eligibility
      - POSTGRES_DB=eligibility
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # No published ports: only services on the internal network reach it.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eligibility -d eligibility"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 512m
    networks:
      - eligibility-agent
    restart: unless-stopped

  # Optional: local LLM for offline demos
  ollama:
    image: ollama/ollama:latest
    profiles:
      - ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - eligibility-agent

networks:
  eligibility-agent:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  ollama_data:
